{% extends "layout.html" %}

{% block title %}
    Agregar producto
{% endblock %}

{% block main %}
<div class="container mt-4">
    <div class="card shadow-sm max-w-md mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Crear Nuevo Producto</h4>
        </div>
        <div class="card-body">
            <form action="/producto/agregar" method="post" class="text-center">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre de Producto:</label>
                    <input autocomplete="off" autofocus class="form-control bg-light" name="nombre" placeholder="Nombre" type="text">
                </div>
                <div class="mb-3">
                    <label for="cantidad" class="form-label fw-bold">Precio:</label>
                    <input class="form-control bg-light" name="precio" placeholder="Precio" type="number" step="0.01">
                </div>
                <div class="d-flex flex-column align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input mb-2" type="radio" name="disponible" id="disponible1" value="1" checked>
                        <label class="form-check-label" for="disponible1">
                            Disponible
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="disponible" id="disponible2" value="0">
                        <label class="form-check-label" for="disponible2">
                            No disponible
                        </label>
                    </div>
                </div>
                <button class="btn btn-primary" type="submit">Agregar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
