{% extends "layout.html" %}

{% block title %}
    Registro de usuario
{% endblock %}

{% block main %}
    <h2 class="title pt-5">Registro de Usuario</h2>
    <form action="/register" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-25" name="nombre" placeholder="Nombre completo" type="text">
        </div>
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-25" name="username" placeholder="Nombre de Usuario" type="text">
        </div>
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-25" name="email" placeholder="Correo electrónico" type="text">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-25" name="password" placeholder="Contraseña" type="password">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-25" name="confirmation" placeholder="Confirmar Contraseña" type="password">
        </div>
        <button class="btn btn-primary mb-3" type="submit">Registrar</button>
    </form>
{% endblock %}
